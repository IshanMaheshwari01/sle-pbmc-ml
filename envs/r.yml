# Phase 2 (pseudobulk statistics) runs in R. Two ways to get it:
#
#   On Ubuntu / WSL (simplest; these exact packages are what the tests ran on):
#     sudo apt install -y r-base-core r-bioc-limma r-bioc-edger r-bioc-deseq2 \
#                         r-cran-ggplot2 r-cran-yaml r-cran-matrix
#
#   Or with conda:  mamba env create -f envs/r.yml && conda activate sle-r
name: sle-r
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base>=4.3
  - r-matrix
  - r-yaml
  - r-ggplot2
  - r-msigdbr                 # optional: gene sets without `make genesets`
  - bioconductor-limma
  - bioconductor-edger
  - bioconductor-deseq2
