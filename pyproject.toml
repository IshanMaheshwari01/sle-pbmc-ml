[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sle-pbmc"
version = "0.1.0"
description = "Donor-level lupus classification and pseudobulk analysis of 1.26M PBMCs (Perez et al. 2022)"
requires-python = ">=3.10"
dependencies = ["anndata", "h5py", "numpy", "pandas", "scipy", "pyyaml", "requests", "tqdm", "tabulate"]

[project.optional-dependencies]
phase1 = [
    "scanpy>=1.10", "scikit-misc", "igraph", "leidenalg", "harmonypy",
    "scvi-tools>=1.1", "scib-metrics", "celltypist", "matplotlib",
    "scikit-learn<1.8",  # CellTypist passes multi_class=, removed in scikit-learn 1.8
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
